name: Build SF_BetterFarming

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ARTIFACT_VERSION: "1.0.3"
  OUTPUT_NAME: "SF_BetterFarming1.0.3.jar"
  MAIN_CLASS: "me.hal989.betterfarming.BetterFarming"
  SLIMEFUN_LEGACY_VERSION: "4.1.48"

concurrency:
  group: sf-betterfarming-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Verify immutable publication policy
        run: python3 -m unittest discover -s scripts -p 'test_immutable_release_policy.py' -v
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Slimefun Legacy locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .deps
          gh release download "v${SLIMEFUN_LEGACY_VERSION}" --repo wickidcow/Slimefun-Legacy --pattern "Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" --dir .deps
          mvn -B install:install-file -Dfile=".deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" -DgroupId=com.github.slimefun -DartifactId=Slimefun -Dversion="${SLIMEFUN_LEGACY_VERSION}" -Dpackaging=jar -DgeneratePom=true
      - name: Verify preservation modernization
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.3</version>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq 'Tag.LEAVES.isTagged' src/main/java/me/hal989/betterfarming/BlockBreakHandler.java
          grep -Fq 'FIREFLY_BUSH' src/main/java/me/hal989/betterfarming/BlockBreakHandler.java
          grep -Fq 'copper-rupee-spear: 60.0' src/main/resources/config.yml
          grep -Fq 'COPPER_RUPEE_SPEAR' src/main/java/me/hal989/betterfarming/BetterFarming.java
      - name: Verify Paper 1.21.11 baseline
        run: >-
          mvn -B -Dmaven.test.skip=true clean package
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version="${SLIMEFUN_LEGACY_VERSION}"
      - name: Verify Paper 26.2 primary compatibility
        run: >-
          mvn -B -Dmaven.test.skip=true clean package
          -Dpaper.version=26.2.build.112-stable
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version="${SLIMEFUN_LEGACY_VERSION}"
      - name: Verify Paper 26.3 alpha compatibility
        run: >-
          mvn -B -Dmaven.test.skip=true clean package
          -Dpaper.version=26.3-rc-3.build.1-alpha
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version="${SLIMEFUN_LEGACY_VERSION}"
      - name: Build universal release JAR from 1.21.11 baseline
        run: >-
          mvn -B -Dmaven.test.skip=true clean package
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version="${SLIMEFUN_LEGACY_VERSION}"
      - name: Validate JAR
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${OUTPUT_NAME}" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          unzip -tqq "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "version: ${ARTIFACT_VERSION}"
          unzip -p "$JAR" config.yml | grep -Fq 'apple-hoe: 30.0'
          javap -verbose -classpath "$JAR" "$MAIN_CLASS" | grep -Fq 'major version: 65'
          ! jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'
          ! jar tf "$JAR" | grep -Eqi '(^|/)net/guizhanss/guizhanlib|(^|/)guizhanlib'
          sha256sum "$JAR"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish new immutable tag only
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${ARTIFACT_VERSION}"
          test "$GITHUB_REF" = "refs/tags/${TAG}"
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to republish or overwrite assets." >&2
            exit 1
          fi
          gh release create "$TAG" "$JAR" --verify-tag --repo "$GITHUB_REPOSITORY" --title "SF_BetterFarming $TAG" --notes "BetterFarming 1.0.3 adds Paper 26.3 alpha compatibility validation while preserving the Paper 1.21.11 / Java 21 universal release baseline, Paper 26.2 as primary, and the existing preservation modernization/gameplay configuration."
