name: Build SF_BetterFarming

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ARTIFACT_VERSION: "1.0.2"
  OUTPUT_NAME: "SF_BetterFarming1.0.2.jar"
  MAIN_CLASS: "me.hal989.betterfarming.BetterFarming"
  SLIMEFUN_LEGACY_VERSION: "4.1.48"
  PAPER_VERSION: "26.2.build.111-stable"

concurrency:
  group: sf-betterfarming-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Slimefun Legacy locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .deps
          gh release download "v${SLIMEFUN_LEGACY_VERSION}" --repo wickidcow/Slimefun-Legacy --pattern "Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" --dir .deps
          mvn -B install:install-file -Dfile=".deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" -DgroupId=com.github.slimefun -DartifactId=Slimefun -Dversion="${SLIMEFUN_LEGACY_VERSION}" -Dpackaging=jar -DgeneratePom=true
      - name: Verify preservation modernization
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.2</version>' pom.xml
          grep -Fq 'Tag.LEAVES.isTagged' src/main/java/me/hal989/betterfarming/BlockBreakHandler.java
          grep -Fq 'FIREFLY_BUSH' src/main/java/me/hal989/betterfarming/BlockBreakHandler.java
          grep -Fq 'copper-rupee-spear: 60.0' src/main/resources/config.yml
          grep -Fq 'COPPER_RUPEE_SPEAR' src/main/java/me/hal989/betterfarming/BetterFarming.java
          grep -Fq 'GNU General Public License v3.0' README.md
          grep -Fq 'NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.' README.md
      - name: Build release JAR
        run: >-
          mvn -B -Dmaven.test.skip=true clean package
          -Dpaper.version="${PAPER_VERSION}"
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version="${SLIMEFUN_LEGACY_VERSION}"
      - name: Validate JAR
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${OUTPUT_NAME}" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          unzip -tqq "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "version: ${ARTIFACT_VERSION}"
          unzip -p "$JAR" config.yml | grep -Fq 'apple-hoe: 30.0'
          javap -verbose -classpath "$JAR" "$MAIN_CLASS" | grep -Fq 'major version: 65'
          ! jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'
          ! jar tf "$JAR" | grep -Eqi '(^|/)net/guizhanss/guizhanlib|(^|/)guizhanlib'
          sha256sum "$JAR"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish immutable release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]] && TAG="$GITHUB_REF_NAME" || TAG="v${ARTIFACT_VERSION}"
          JAR="dist/${OUTPUT_NAME}"
          EXPECTED="sha256:$(sha256sum "$JAR" | awk '{print $1}')"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq ".assets[] | select(.name == \"${OUTPUT_NAME}\") | .digest" | head -n1 || true)"
            if [[ -n "$EXISTING" ]]; then [[ "$EXISTING" == "$EXPECTED" ]] || exit 1; else gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY"; fi
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SF_BetterFarming $TAG" --notes "Final preservation modernization: keeps classic BetterFarming progression, uses the vanilla leaves tag for future tree families, retains modern vegetation/copper weapons, and moves non-Master-Sword drop chances into config with defaults identical to 1.0.1."
          fi
